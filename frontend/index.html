<!doctype html>
<html lang="en" data-theme="fume">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full screen on phones with a notch; safe-area insets in CSS keep content clear of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1411" />
    <meta name="description" content="ChangeWatch watches the pages you care about, ignores the noise, and tells you the moment something real changes." />

    <!-- Installable web app (Android, desktop) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Installable web app (iPhone and iPad: Share, then Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ChangeWatch" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preload" href="/src/assets/fonts/zodiak-300.woff2" as="font" type="font/woff2" crossorigin />
    <title>ChangeWatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
